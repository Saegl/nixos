# Maps
map f10 launch --type=tab --cwd=current fish
map f12 launch --type=tab --stdin-source=@screen_scrollback nvim

# Sound
enable_audio_bell no

# Opaque: vesper's own #101010 background, no terminal alpha
background_opacity 1.0
# background_blur <radius>

# Colors (vesper, matching dotfiles/nvim/init.lua)
background            #101010
foreground            #CCCCCC
selection_background  #343434
selection_foreground  #FFFFFF
cursor                #FFC799
cursor_text_color     #101010
url_color             #82D9C2
active_border_color   #65737E
inactive_border_color #232323

# vesper is near-monochrome: it has no blue, so blue reuses the teal accent
color0  #101010
color8  #65737E
color1  #FF8080
color9  #FF8080
color2  #82D9C2
color10 #82D9C2
color3  #FFC799
color11 #FFCFA8
color4  #82D9C2
color12 #65737E
color5  #FFCFA8
color13 #FF8080
color6  #A0A0A0
color14 #FFCFA8
color7  #CCCCCC
# vesper maps bright white to its comment gray, which renders bold text dimmer
# than normal text in a real shell; kept white here
color15 #FFFFFF

# Fonts
font_size 20.0
font_family IosevkaTerm Nerd Font Mono
# Disable italics
italic_font      family="IosevkaTerm Nerd Font Mono" style=Regular
bold_italic_font family="IosevkaTerm Nerd Font Mono" style=Bold

# Window
hide_window_decorations yes

# Tabs
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
tab_bar_edge              top
tab_bar_margin_width      0
tab_bar_margin_height     4 0
tab_bar_style             separator
tab_separator             ""
active_tab_font_style     bold
tab_title_template        "{fmt.fg._65737e}{fmt.bg._232323} {title.split()[0]} {fmt.bg.default} "
active_tab_title_template "{fmt.fg._101010}{fmt.bg._ffc799} {title.split()[0]} {fmt.bg.default} "
map shift+enter send_text all \e\r
