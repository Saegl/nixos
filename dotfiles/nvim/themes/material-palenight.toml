# material-palenight: generated by scripts/theme2toml.lua from https://github.com/marko-cerovac/material.nvim (rev 92f7366)
# as ':colorscheme material-palenight'.
# Group = { ... } sets attributes, Group = "Target" links. Colors are [palette] names, else as
# nvim_set_hl takes them ('#rrggbb', 'NvimDarkRed'). Loaded by lua/toml_theme.lua.

name = "material-palenight"
source = "https://github.com/marko-cerovac/material.nvim"
background = "dark"

[palette]
gray = "#717cb4"
black = "#000000"
red = "#f07178"
green = "#c3e88d"
yellow = "#ffcb6b"
blue = "#82aaff"
paleblue = "#b0c9ff"
cyan = "#89ddff"
purple = "#c792ea"
orange = "#f78c6c"
pink = "#ff5370"
link = "#80cbc4"
cursor = "#ffcc00"
line_numbers = "#3a3f58"
comments = "#676e95"
bg = "#292d3e"
bg_alt = "#1b1e2b"
fg = "#a6accd"
contrast = "#202331"
active = "#414863"
disabled = "#515772"
accent = "#ab47bc"

[highlights]

# Editor UI
ColorColumn = { bg = "active" }
Conceal = { fg = "disabled" }
Cursor = { fg = "bg_alt", bg = "cursor" }
CursorColumn = "CursorLine"
CursorLine = { bg = "active" }
CursorLineNr = { fg = "accent" }
DiffAdd = { bg = "#48524e" }
