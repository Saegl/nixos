# nord: generated by scripts/theme2toml.lua from https://github.com/shaunsingh/nord.nvim (rev 80c1e53)
# as ':colorscheme nord'.
# Group = { ... } sets attributes, Group = "Target" links. Colors are [palette] names, else as
# nvim_set_hl takes them ('#rrggbb', 'NvimDarkRed'). Loaded by lua/toml_theme.lua.

name = "nord"
source = "https://github.com/shaunsingh/nord.nvim"
background = "dark"

[palette]
