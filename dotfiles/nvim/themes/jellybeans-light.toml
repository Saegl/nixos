# jellybeans-light: generated by scripts/theme2toml.lua from https://github.com/wtfox/jellybeans.nvim (rev e732023)
# as ':colorscheme jellybeans-light', with --before: vim.o.background = 'light'.
# Group = { ... } sets attributes, Group = "Target" links. Colors are [palette] names, else as
# nvim_set_hl takes them ('#rrggbb', 'NvimDarkRed'). Loaded by lua/toml_theme.lua.

name = "jellybeans-light"
source = "https://github.com/wtfox/jellybeans.nvim"
background = "light"

[palette]
background = "#f5e6d3"
foreground = "#252525"
bg = "#000000"
fg = "#ffffff"
grey = "#787878"
grey_one = "#e8d5c0"
grey_three = "#d8c8b8"
regent_grey = "#7a8490"
scorpion = "#606060"
tundora = "#404040"
zambezi = "#605958"
silver = "#c7c7c7"
alto = "#444444"
gravel = "#d0ccd1"
boulder = "#777777"
bright_grey = "#e8e8e8"
shuttle_grey = "#939da6"
cadet_blue = "#505860"
perano = "#234291"
wewak = "#904070"
