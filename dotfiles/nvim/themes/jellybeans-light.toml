error = "#ff3333"
warning = "#a66510"
info = "#1670af"
ok = "#386014"

[terminal]
0 = "fg"
1 = "error"
2 = "highland"
3 = "brandy"
4 = "ship_cove"
5 = "wewak"
6 = "calypso"
7 = "silver"
8 = "grey"
9 = "error"
10 = "ok"
11 = "warning"
12 = "info"
13 = "#5f43aa"
14 = "calypso"
15 = "bg"

[highlights]

