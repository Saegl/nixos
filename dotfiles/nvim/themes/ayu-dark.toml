# ayu-dark: generated by scripts/theme2toml.lua from https://github.com/Shatur/neovim-ayu (rev e5a9f0f)
# as ':colorscheme ayu-dark'.
# Group = { ... } sets attributes, Group = "Target" links. Colors are [palette] names, else as
# nvim_set_hl takes them ('#rrggbb', 'NvimDarkRed'). Loaded by lua/toml_theme.lua.

name = "ayu-dark"
source = "https://github.com/Shatur/neovim-ayu"
background = "dark"

[palette]
white = "#ffffff"
black = "#000000"
lsp_inlay_hint = "#969696"
accent = "#e6b450"
bg = "#0b0e14"
fg = "#bfbdb6"
ui = "#565b66"
tag = "#39bae6"
func = "#ffb454"
entity = "#59c2ff"
string = "#aad94c"
regexp = "#95e6cb"
markup = "#f07178"
keyword = "#ff8f40"
special = "#e6b673"
comment = "#636a72"
constant = "#d2a6ff"
operator = "#f29668"
error = "#d95757"
lsp_parameter = "#cb9ff8"
line = "#11151c"
panel_bg = "#0f131a"
panel_shadow = "#05070a"
gutter_normal = "#454b55"
selection_inactive = "#122132"
guide_normal = "#1e222a"
vcs_added = "#7fd962"
vcs_modified = "#73b8ff"
vcs_removed = "#f26d78"
vcs_added_bg = "#1d2214"
vcs_removed_bg = "#2d2220"

[terminal]
