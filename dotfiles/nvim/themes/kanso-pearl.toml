# kanso-pearl: generated by scripts/theme2toml.lua from https://github.com/webhooked/kanso.nvim (rev 1afbbb4)
# as ':colorscheme kanso-pearl', with --before: vim.o.background = 'light'.
# Group = { ... } sets attributes, Group = "Target" links. Colors are [palette] names, else as
# nvim_set_hl takes them ('#rrggbb', 'NvimDarkRed'). Loaded by lua/toml_theme.lua.

