# bark - a warmer colorscheme, https://github.com/if-not-nil/bark
# Converted from upstream's bark.vim (rev be14cfb), minus entries equal to Neovim's defaults.
# Loaded by lua/toml_theme.lua. Colors are palette names or anything nvim_set_hl takes
# ('#rrggbb', 'NvimDarkRed', 'bg'). Group = { ... } sets attributes, Group = "Target" links.

name = "bark"
source = "https://github.com/if-not-nil/bark"
background = "dark"

[palette]
bg0 = "#101010"
bg1 = "#181818"
bg2 = "#202020"
bg3 = "#2b2b2b"
gray = "#505050"
text_dim = "#b0b0b0"
