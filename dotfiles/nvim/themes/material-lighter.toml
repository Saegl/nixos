# material-lighter: generated by scripts/theme2toml.lua from https://github.com/marko-cerovac/material.nvim (rev 92f7366)
# as ':colorscheme material-lighter'.
# Group = { ... } sets attributes, Group = "Target" links. Colors are [palette] names, else as
# nvim_set_hl takes them ('#rrggbb', 'NvimDarkRed'). Loaded by lua/toml_theme.lua.

name = "material-lighter"
source = "https://github.com/marko-cerovac/material.nvim"
background = "light"

[palette]
white = "#ffffff"
black = "#000000"
red = "#e53935"
green = "#91b859"
yellow = "#f6a434"
blue = "#6182b8"
paleblue = "#8796b0"
cyan = "#39adb5"
purple = "#7c4dff"
orange = "#f76d47"
pink = "#ff5370"
link = "#80cbc4"
cursor = "#272727"
line_numbers = "#cfd8dc"
comments = "#aabfc9"
bg = "#fafafa"
fg = "#546e7a"
fg_dark = "#94a7b0"
contrast = "#eeeeee"
active = "#e7e7e8"
disabled = "#d2d4d5"
accent = "#00bcd4"

[highlights]

