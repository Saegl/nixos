# sonokai-shusia: generated by scripts/theme2toml.lua from https://github.com/sainnhe/sonokai (rev b023c52)
# as ':colorscheme sonokai', with --before: vim.g.sonokai_better_performance = 1; vim.g.sonokai_style = "shusia".
# Group = { ... } sets attributes, Group = "Target" links. Colors are [palette] names, else as
# nvim_set_hl takes them ('#rrggbb', 'NvimDarkRed'). Loaded by lua/toml_theme.lua.

