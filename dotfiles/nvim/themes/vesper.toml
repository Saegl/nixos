# vesper: generated by scripts/theme2toml.lua from https://github.com/datsfilipe/vesper.nvim (rev 1717b1a)
# as ':colorscheme vesper', with --before: require("vesper").setup({ transparent = false }).
# Group = { ... } sets attributes, Group = "Target" links. Colors are [palette] names, else as
# nvim_set_hl takes them ('#rrggbb', 'NvimDarkRed'). Loaded by lua/toml_theme.lua.

name = "vesper"
source = "https://github.com/datsfilipe/vesper.nvim"
background = "dark"

[palette]
