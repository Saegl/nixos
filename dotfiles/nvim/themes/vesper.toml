fgAlt = "#fefefe"
border = "#505050"
red = "#ff8080"
orange = "#ffcfa8"
primary = "#a0a0a0"
warn = "#ffc799"
info = "#99ffe4"
hint = "#65737e"
base = "#ffffff"

[terminal]
