# bamboo-light: generated by scripts/theme2toml.lua from https://github.com/ribru17/bamboo.nvim (rev 1309bc8)
# as ':colorscheme bamboo-light', with --before: require("bamboo").setup({}).
# Group = { ... } sets attributes, Group = "Target" links. Colors are [palette] names, else as
# nvim_set_hl takes them ('#rrggbb', 'NvimDarkRed'). Loaded by lua/toml_theme.lua.

