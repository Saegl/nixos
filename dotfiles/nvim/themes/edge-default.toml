# edge-default: generated by scripts/theme2toml.lua from https://github.com/sainnhe/edge (rev 7ec78c2)
# as ':colorscheme edge', with --before: vim.g.edge_better_performance = 1; vim.g.edge_style = "default".
# Group = { ... } sets attributes, Group = "Target" links. Colors are [palette] names, else as
# nvim_set_hl takes them ('#rrggbb', 'NvimDarkRed'). Loaded by lua/toml_theme.lua.

name = "edge-default"
source = "https://github.com/sainnhe/edge"
background = "dark"

[palette]
