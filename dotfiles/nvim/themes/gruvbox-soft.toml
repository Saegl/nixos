# gruvbox-soft: generated by scripts/theme2toml.lua from https://github.com/ellisonleao/gruvbox.nvim (rev 154eb5f)
# as ':colorscheme gruvbox', with --before: require("gruvbox").setup({ contrast = "soft" }).
# Group = { ... } sets attributes, Group = "Target" links. Colors are [palette] names, else as
# nvim_set_hl takes them ('#rrggbb', 'NvimDarkRed'). Loaded by lua/toml_theme.lua.

