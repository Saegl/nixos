# vscode-light: generated by scripts/theme2toml.lua from https://github.com/Mofiqul/vscode.nvim (rev aa1102a)
# as ':colorscheme vscode', with --before: vim.o.background = 'light'.
# Group = { ... } sets attributes, Group = "Target" links. Colors are [palette] names, else as
# nvim_set_hl takes them ('#rrggbb', 'NvimDarkRed'). Loaded by lua/toml_theme.lua.

