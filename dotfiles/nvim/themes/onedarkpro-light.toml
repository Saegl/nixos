# onedarkpro-light: generated by scripts/theme2toml.lua from https://github.com/olimorris/onedarkpro.nvim (rev ef009ae)
# as ':colorscheme onelight', with --before: vim.o.background = 'light'.
# Group = { ... } sets attributes, Group = "Target" links. Colors are [palette] names, else as
# nvim_set_hl takes them ('#rrggbb', 'NvimDarkRed'). Loaded by lua/toml_theme.lua.

name = "onedarkpro-light"
source = "https://github.com/olimorris/onedarkpro.nvim"
background = "light"

[palette]
background = "#e9e9e9"
backgroundPanel = "#f4f4f4"
border = "#e7e7e7"
borderSubtle = "#cccccc"
diffAddedBg = "#dff0de"
diffRemovedBg = "#f7e6e8"
blue = "#118dc3"
cyan = "#56b6c2"
green = "#1da912"
purple = "#9a77cf"
red = "#e05661"
yellow = "#eea825"
bg = "#fafafa"
fg = "#6a6a6a"
orange = "#ee9025"
gray = "#bebebe"
highlight = "#e2be7d"
comment = "#9b9fa6"

[terminal]
0 = "fg"
1 = "red"
2 = "green"
3 = "yellow"
4 = "blue"
5 = "purple"
6 = "cyan"
7 = "fg"
8 = "gray"
9 = "#ff626e"
10 = "#24cf16"
11 = "#ffb428"
12 = "#14a9e9"
13 = "#b68df5"
14 = "#67dae8"
15 = "fg"

