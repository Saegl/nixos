# onedark-light: generated by scripts/theme2toml.lua from https://github.com/navarasu/onedark.nvim (rev df4792a)
# as ':colorscheme onedark', with --before: vim.o.background = 'light'; require("onedark").setup({ style = "light" }).
# Group = { ... } sets attributes, Group = "Target" links. Colors are [palette] names, else as
# nvim_set_hl takes them ('#rrggbb', 'NvimDarkRed'). Loaded by lua/toml_theme.lua.

name = "onedark-light"
source = "https://github.com/navarasu/onedark.nvim"
background = "light"

[palette]
