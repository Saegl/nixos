# gruvbox-material-soft: generated by scripts/theme2toml.lua from https://github.com/sainnhe/gruvbox-material (rev 11d779b)
# as ':colorscheme gruvbox-material', with --before: vim.g.gruvbox_material_background = "soft"; vim.g.gruvbox_material_better_performance = 1.
# Group = { ... } sets attributes, Group = "Target" links. Colors are [palette] names, else as
# nvim_set_hl takes them ('#rrggbb', 'NvimDarkRed'). Loaded by lua/toml_theme.lua.

