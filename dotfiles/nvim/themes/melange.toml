# melange: generated by scripts/theme2toml.lua from https://github.com/savq/melange-nvim (rev ce42f6b)
# as ':colorscheme melange'.
# Group = { ... } sets attributes, Group = "Target" links. Colors are [palette] names, else as
# nvim_set_hl takes them ('#rrggbb', 'NvimDarkRed'). Loaded by lua/toml_theme.lua.

name = "melange"
source = "https://github.com/savq/melange-nvim"
background = "dark"

[palette]
bg = "#292522"
fg = "#ece1d7"
dark_cyan = "#253333"
dark_green = "#233524"
dark_magenta = "#422741"
dark_red = "#7d2a2f"
dark_yellow = "#8b7449"
black = "#34302c"
blue = "#7f91b2"
cyan = "#7b9695"
green = "#78997a"
magenta = "#cf9bc2"
red = "#bd8183"
yellow = "#ebc06d"
brightBlue = "#a3a9ce"
brightCyan = "#89b3b6"
brightGreen = "#85b695"
brightRed = "#d47766"
purple = "#b380b0"
sel = "#403a36"
ui = "#867462"
com = "#c1a78e"

[terminal]
0 = "black"
1 = "red"
2 = "green"
3 = "#e49b5d"
